packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.7'
  - '@better-auth/drizzle-adapter@1.7.7'
  - '@better-auth/kysely-adapter@1.7.7'
  - '@better-auth/memory-adapter@1.7.7'
  - '@better-auth/mongo-adapter@1.7.7'
  - '@better-auth/prisma-adapter@1.7.7'
  - '@better-auth/telemetry@1.7.7'
  - better-auth@1.7.7
  - '@anthropic-ai/sdk@0.131.0'

# pnpm 11+: dependency build scripts are opt-in.
allowBuilds:
  esbuild: true
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  cpu-features: false
  protobufjs: false
  ssh2: false
