# Production overlay: TLS via Caddy, the app reachable only through it.
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
services:
  app:
    ports: !override []
    environment:
      NODE_ENV: production
      TRUST_PROXY: 'true'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:
