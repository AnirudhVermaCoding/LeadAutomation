# Production overlay: TLS via Caddy, the app reachable only through it, the database is Supabase.
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d      (or just: deploy/deploy.sh)
# DATABASE_OWNER_URL / DATABASE_URL come from .env (Supabase session pooler, port 5432; see docs/OPERATIONS.md).
services:
  # The local Postgres container is for development and CI only; it never starts in production.
  db:
    profiles: ['local-db']

  migrate:
    depends_on: !reset {}
    environment:
      NODE_ENV: production
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?set DATABASE_OWNER_URL (Supabase) in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Supabase) in .env}

  app:
    ports: !override []
    environment:
      NODE_ENV: production
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?set DATABASE_OWNER_URL (Supabase) in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Supabase) in .env}
      TRUST_PROXY: 'true'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env (the public hostname)}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  caddy_data:
  caddy_config:
